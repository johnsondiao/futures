name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build signed Release APK
        run: ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK=$APK"
          ls -lh "$APK"
          if echo "$APK" | grep -qi unsigned; then
            echo "ERROR: unsigned APK produced — phone install will fail"
            exit 1
          fi
          unzip -l "$APK" | grep -E 'META-INF/.*\.(RSA|DSA|EC)' 
          echo "APK signature entries OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: channel-strategy-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
