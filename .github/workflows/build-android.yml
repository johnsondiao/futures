name: Build Android APK

# 触发条件：push 时只在 android/ 或本文件改动时触发；
# workflow_dispatch 支持在 GitHub Actions 页面手动点 "Run workflow" 触发
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build signed Release APK
        run: ./gradlew assembleRelease

      - name: Check APK artifact
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK=$APK"
          ls -lh "$APK"
          if echo "$APK" | grep -qi unsigned; then
            echo "ERROR: unsigned APK produced — phone install will fail"
            exit 1
          fi
          # AGP 8+ 常用 v2/v3 签名，不一定有 META-INF/*.RSA，不能靠 grep 判失败
          test -s "$APK"
          echo "APK ready for upload"

      - name: Clean up old artifacts (prevent storage quota overflow)
        uses: actions/github-script@v7
        with:
          script: |
            // 删除本仓库除当前 run 之外的所有旧 artifacts（按天保留最近 2 次构建）
            const retainRuns = 2;
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-android.yml',
              status: 'success',
              per_page: 30,
            });
            const keptRunIds = new Set();
            for (const run of runs.workflow_runs.slice(0, retainRuns)) keptRunIds.add(run.id);
            keptRunIds.add(context.runId);
            const { data: arts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let freed = 0;
            for (const a of arts.artifacts) {
              if (!keptRunIds.has(a.workflow_run.id) && !a.expired) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: a.id,
                  });
                  freed += a.size_in_bytes;
                  core.info(`Deleted old artifact ${a.name} (${(a.size_in_bytes/1024/1024).toFixed(1)} MB, run #${a.workflow_run.id})`);
                } catch (e) {
                  core.warning(`Failed to delete artifact ${a.name}: ${e.message}`);
                }
              }
            }
            core.info(`Freed ${(freed/1024/1024).toFixed(1)} MB of storage`);

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: channel-strategy-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
