<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />
  <title>通道策略 · 条件单</title>
  <link rel="stylesheet" href="style.css" />
  <script src="lightweight-charts.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-main">
      <span class="brand">通道策略</span>
      <span id="priceNow" class="price-now">—</span>
      <span id="meta" class="meta">连接中…</span>
    </div>
    <div id="liveDot" class="dot off" title="数据源"></div>
  </header>

  <section class="chart-wrap">
    <div class="chart-bar">
      <span>5分钟 K线</span>
      <div class="chart-actions">
        <button type="button" id="chartReset" class="link-btn reset-btn" hidden>复位</button>
        <button type="button" id="cciToggle" class="link-btn" aria-expanded="false">CCI</button>
      </div>
    </div>
    <div class="chart-main-row">
      <div id="priceChart" class="chart main"></div>
      <div id="axisLabelRail" class="axis-label-rail" aria-hidden="true"></div>
    </div>
    <div id="cciPanel" class="cci-panel collapsed">
      <div id="cciChart" class="chart cci"></div>
    </div>
  </section>

  <section id="orderCard" class="card order-card wait">
    <div class="card-head">
      <div id="needBadge" class="badge">—</div>
      <p id="summary" class="summary">加载中…</p>
    </div>
    <div id="orderList" class="orders"></div>
    <p id="how" class="hint"></p>
  </section>

  <section id="analyticsCard" class="card analytics-card">
    <div class="card-head">
      <div class="badge soft">机会评估</div>
      <p id="biasText" class="summary">加载中…</p>
    </div>
    <div id="analyticsBody" class="analytics-body"></div>
    <p id="analyticsNote" class="hint"></p>
  </section>

  <footer class="foot">手机直连天勤行情 · 策略在本机计算 · 下拉刷新重连</footer>
  <div id="alertToast" class="alert-toast" hidden></div>
  <script>window.CHANNEL_DEVICE = true;</script>
  <script src="strategy.js"></script>
  <script src="app.js"></script>
</body>
</html>
